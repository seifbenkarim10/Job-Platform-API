version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: job-platform-mongo
    restart: unless-stopped
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: job-platform

  redis:
    image: redis:7-alpine
    container_name: job-platform-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data: